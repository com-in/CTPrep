; ============================================================================
;  CTPrep 配置文件
;  所有在线下载内容都会被保存到 [General] RuntimeDir 指定的目录中。
;  相对路径一律相对于主程序（CTPrep.exe）所在目录。
; ============================================================================

[General]
; 运行时目录：镜像 / PE / 驱动包 / 临时文件都放这里
RuntimeDir=.\runtime
; 是否启用演练模式（1=只打印将要执行的命令，不真正改动磁盘）。首次调试请保持 1
DryRun=0
; 准备完成后是否删掉已消耗的下载文件（1=删掉那几 GB，0=保留缓存，下次重装不用重新下载）
CleanupDownloads=1
; 日志级别：Debug / Info / Warn / Error
LogLevel=Info
; 界面语言：zh-CN / en-US / auto（auto = 跟随系统语言）；界面里改过语言后以此处为准的覆盖值保存在 runtime\ui-language.txt
Language=auto

[PE]
; ---------------------------------------------------------------------------
; PE 环境来源。相对路径以 CTPrep.exe 所在目录为基准。
; 支持格式：.wim（直接使用）/ .iso（自动取其中的 64 位 PE 映像与配套 sdi）
;           / .zip / .7z（先解压，包内如有 ISO 会自动再挂载进去找）
; 程序会自动排除 32 位 PE 映像（例如 Dream-M_32.wim），只取 64 位那份。
; ---------------------------------------------------------------------------
Default=LightningPE
; 内置的雷电PE 精简版：已移除 32 位子系统、第三方工具、浏览器、输入法与 Flash，
; 并预先注入 CTPrep 自动部署脚本（外壳已归一为 winpeshl），无需再解压整包。
; 由 tools\slim-lightningpe.ps1 生成。
LightningPE=.\runtime\pe\boot.wim
; 需要原始整包时切回这一行（程序会自动解压并取其中的 64 位 PE）：
; LightningPE=..\tools\Lightning PE V1.8-B3.2_NVME.7z
; 想换成在线地址也可以，例如：
; LightningPE=https://example.com/LightningPE_B3.2_NVME.7z
; 也可以填「链接清单」地址（.json，例如部署在 Cloudflare Pages 上的 images.json）：
; 程序会先请求清单，再从 pe 条目取真正的链接。格式与部署方法见 docs\README.md
;
; 备用方案：用 tools\build-winpe.ps1 自建精简 PE（产物在 .\runtime\pe\boot.wim）
; Default=LocalPe
; LocalPe=.\runtime\pe\boot.wim
; 可选 SHA256 校验（小写十六进制，留空表示不校验）
Sha256=

[Image]
; ---------------------------------------------------------------------------
; 系统镜像下载地址。key 需要和程序探测到的系统版本一致，未命中时回退到 Default。
; 探测结果形如：Windows 11 24H2 / Windows 11 23H2 / Windows 10 22H2
; 支持格式：.iso / .wim / .esd
; 也可以填「链接清单」地址（.json）：程序会先请求清单，再按本机版本挑链接；
; 清单格式与部署方法见 docs\README.md
; ---------------------------------------------------------------------------
; 默认走「链接清单」：程序先请求这个 .json，再按本机版本挑真正的镜像地址。
; 换镜像源只改这个文件（仓库里的 docs/images.json），程序不用动。
Default=https://ctprep.acmcdev.top/images.json
; 也可以直接填镜像文件地址（.iso / .wim / .esd），例如：
; Default=https://example.com/win11_x64.iso
; 用 tools\build-winpe.ps1 -ImageDir <目录> 可把系统 ISO 精简成只含一个版本（其余版本丢弃），
; 产物在 <目录>\slim\install.wim，改成下面两行即可
; Default=SlimImage
; SlimImage=D:\iso\slim\install.wim
Windows 11 24H2=
Windows 11 23H2=
Windows 11 22H2=
Windows 10 22H2=
Windows 10 21H2=
; 可选 SHA256 校验（留空表示不校验）
Sha256=

[Drivers]
; ---------------------------------------------------------------------------
; 驱动包列表：支持 .zip / .7z（解压后自动查找 *.inf）/ 目录 / .exe（静默安装）
; 每一项都会在系统首次启动时由 SetupComplete.cmd 自动安装。
; ---------------------------------------------------------------------------
; 是否导出当前系统已装的第三方驱动并随新系统一起安装（1=是）。
; 重装后网卡驱动丢失是最常见的「装完上不了网」。Windows 7 的 pnputil 不支持导出，会自动跳过。
ExportCurrent=1
; Pack1=.\drivers\chipset.zip
; Pack2=https://example.com/audio.exe

[Deploy]
; 暂存分区大小（MB）。PE 与系统镜像会被放进这个临时分区，
; 部署完成后自动删除并把空间合并回去。建议 >= 镜像大小 + 1GB
StagingSizeMB=12288
; 暂存分区卷标（同时作为 PE 定位暂存分区的标记目录名）
StagingLabel=CTPREP
; 全新安装时目标分区的卷标
TargetLabel=Windows
; 默认安装方式：Clean=全新安装（格式化目标分区）  KeepFiles=保留文件（清空 Windows 目录）
DefaultInstallMode=Clean
; 默认是否使用无人值守（1=自动完成 OOBE）
DefaultUnattended=1
; 默认时区
DefaultTimeZone=China Standard Time
