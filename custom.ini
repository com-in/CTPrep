; ============================================================================
;  CTPrep 高级设置配置（custom.ini）
;  与默认配置 config.ini 完全独立：新手模式只读 config.ini，
;  高级设置的界面初值与下载来源全部来自本文件。
;
;  格式与 config.ini 一致；相对路径相对于主程序（CTPrep.exe）所在目录。
;  本文件不存在时，程序会自动用 config.ini 复制一份再读取。
; ============================================================================

[General]
; 运行时目录：镜像 / PE / 驱动包 / 临时文件都放这里
RuntimeDir=.\runtime
; 是否启用演练模式（1=只打印将要执行的命令，不真正改动磁盘）
DryRun=0
; 界面语言：zh-CN / en-US / auto（auto = 跟随系统语言）
Language=auto

[PE]
; ---------------------------------------------------------------------------
; 高级设置使用的 PE 来源。相对路径以 CTPrep.exe 所在目录为基准。
; 支持格式：.wim（直接使用）/ .iso（自动取其中的 64 位 PE 映像与配套 sdi）
;           / .zip / .7z（先解压，包内如有 ISO 会自动再挂载进去找）
; ---------------------------------------------------------------------------
Default=LightningPE
; 内置的雷电PE 精简版：已精简并预先注入 CTPrep 自动部署脚本
LightningPE=.\runtime\pe\boot.wim
; 需要原始整包时切回：..\tools\Lightning PE V1.8-B3.2_NVME.7z
; 可选 SHA256 校验（小写十六进制，留空表示不校验）
Sha256=

[Image]
; ---------------------------------------------------------------------------
; 高级设置使用的系统镜像。key 可任意命名，Default 为默认镜像。
; 支持格式：.iso / .wim / .esd
; ---------------------------------------------------------------------------
Default=https://ctprep.acmcdev.top/images.json
; 可选 SHA256 校验（留空表示不校验）
Sha256=

[Drivers]
; ---------------------------------------------------------------------------
; 驱动包列表：支持 .zip（解压后自动查找 *.inf）/ 目录 / .exe（静默安装）
; 每一项都会在系统首次启动时由 SetupComplete.cmd 自动安装。
; ---------------------------------------------------------------------------
; Pack1=.\drivers\chipset.zip
; Pack2=https://example.com/audio.exe

[Deploy]
; 暂存分区大小（MB）。PE 与系统镜像会被放进这个临时分区，
; 部署完成后自动删除并把空间合并回去。建议 >= 镜像大小 + 1GB
StagingSizeMB=12288
; 暂存分区卷标（同时作为 PE 定位暂存分区的标记目录名）
StagingLabel=CTPREP
; 全新安装时目标分区的卷标
TargetLabel=Windows
; 默认安装方式：Clean=全新安装（格式化目标分区）  KeepFiles=保留文件（清空 Windows 目录）
DefaultInstallMode=Clean
; 默认是否使用无人值守（1=自动完成 OOBE）
DefaultUnattended=1
; 默认时区
DefaultTimeZone=China Standard Time
