# Sync Microsoft download links into the link manifest (docs/images.json).
#
# The official links expire after ~24 hours, so the manifest must be refreshed
# before that. GitHub cron cannot express "every 23 hours", so this workflow
# wakes up hourly and syncs only when the manifest is older than 22 hours.
# With hourly wake-ups that yields a refresh cycle of ~22-23 hours while
# always keeping at least one hour of margin before the links expire. A failed
# run is simply retried at the next hourly wake-up.
#
# The commit deliberately does NOT use [skip ci]: that flag also skips the
# GitHub Pages deployment, which is what actually publishes docs/images.json.
# build.yml ignores manifest-only changes instead (paths-ignore), so a sync
# commit still refreshes the published manifest without triggering a build.
#
# Triggers:
#   - schedule          : hourly wake-up; syncs only when the manifest is stale
#   - workflow_dispatch : manual run; always syncs
#   - push (this file)  : self-test whenever the workflow itself is edited
name: sync-links

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    # without this a tag push also fires this job, and the checkout then has a
    # detached HEAD
    branches: [main]
    paths:
      - .github/workflows/sync-links.yml

permissions:
  contents: write

concurrency:
  group: sync-links
  cancel-in-progress: false

env:
  # Run the JavaScript actions on Node 24. GitHub is retiring the Node 20
  # action runtime during 2026, so pin it here instead of inheriting
  # whatever the runner image happens to default to.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Microsoft links
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 tools/sync-microsoft-links.py --min-age-hours 22
          else
            python3 tools/sync-microsoft-links.py
          fi

      - name: Commit and push when changed
        run: |
          if git diff --quiet -- docs/images.json; then
            echo "manifest unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images.json
          git commit -m "Sync Microsoft download links"
          # Someone may have pushed while the sync was running: rebase onto their
          # work and retry. Do NOT use --force here: it would overwrite the
          # remote branch and silently drop their commits.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && \
               git push origin HEAD:refs/heads/main; then
              echo "sync commit pushed"
              break
            fi
            echo "push attempt ${attempt} failed, retrying"
            sleep 5
          done
